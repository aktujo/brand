# SPDX-License-Identifier: MIT
# Licence and copyright of files that cannot carry a header (REUSE specification 3.3). The generator names its own
# licence in an SPDX header.
version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "falkOSS – Falcon Lake Open Source Software gUG (haftungsbeschränkt) i. G. and the aktujo contributors"

[[annotations]]
path = ["**/*.md", "LICENSE", "**/.gitignore"]
precedence = "aggregate"
SPDX-FileCopyrightText = "falkOSS – Falcon Lake Open Source Software gUG (haftungsbeschränkt) i. G. and the aktujo contributors"
SPDX-License-Identifier = "MIT"

# The artwork, generated by generate.py: to be passed on unchanged – see README.md for the name and the brand.
[[annotations]]
path = ["svg/**", "png/**", "web/**", "apps/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "falkOSS – Falcon Lake Open Source Software gUG (haftungsbeschränkt) i. G."
SPDX-License-Identifier = "CC-BY-ND-4.0"

# Space Mono, used unmodified for the wordmark (turned into outlines by generate.py).
[[annotations]]
path = "fonts/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2016 The Space Mono Project Authors (https://github.com/googlefonts/spacemono)"
SPDX-License-Identifier = "OFL-1.1"
